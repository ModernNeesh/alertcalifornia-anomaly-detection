<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Camera Embedding Viewer</title>

  <script src="https://cdn.plot.ly/plotly-3.3.1.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<div id="controls-bar">

  <h2>Camera Embedding Viewer</h2>

  <div class="controls-row">
    <label for="dataset">Dataset:</label>
    <select id="dataset" multiple size="1"></select>

    <label for="mode">Plot Mode:</label>
    <select id="mode">
      <option value="3d">3D</option>
      <option value="2d">2D</option>
    </select>

    <div id="x-select">
      <label for="x">X:</label>
      <select id="x"></select>
    </div>

    <div id="y-select">
      <label for="y">Y:</label>
      <select id="y"></select>
    </div>

    <div id="z-select">
      <label for="z">Z:</label>
      <select id="z"></select>
    </div>
  </div>

  <div id="color-row">

    <label for="colorBy">Color By:</label>
    <select id="colorBy">
      <option value="label">Label</option>
      <option value="season">Season</option>
      <option value="daytime">Daytime</option>
      <option value="hour">Hour</option>
    </select>

  </div>

</div>

<div id="plot" style="width:100%; height:750px"></div>

<div id="img-preview">
  <div id="preview-label"></div>
  <img id="preview-img">
</div>

<script src="app.js"></script>

</body>
</html>
