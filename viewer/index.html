<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Camera Embedding Viewer</title>

  <script src="https://cdn.plot.ly/plotly-3.3.1.min.js"></script>
  <link rel="stylesheet" href="styles.css">

</head>
<body>

<div id="controls-bar">
  <h2>Camera Embedding Viewer</h2>

  <label for="camera">Dataset:</label>
  <select id="camera"></select>

  <label for="mode">Plot Mode:</label>
  <select id="mode">
    <option value="3d">3D</option>
    <option value="2d">2D</option>
  </select>

  <div id="x-select">
    <label for="x">X:</label>
    <select id="x"></select>
  </div>

  <div id="y-select">
    <label for="y">Y:</label>
    <select id="y"></select>
  </div>

  <div id="z-select">
    <label for="z">Z:</label>
    <select id="z"></select>
  </div>
</div>
  

<div id="plot" style="width:100%; height:750px;"></div>

<div id="img-preview">
  <img id="preview-img" width=350">
</div>

<script src="app.js"></script>

</body>
</html>
